name: CI

# PRs to main:   build + test + pack; packages attached to the run as an artifact.
# Push to main:  same, then publish 0.1.0-ci.<run> prereleases to nuget.org.
# Push a v* tag: same, then publish the stable version from the tag (v1.2.3 -> 1.2.3) to nuget.org.
#
# Publishing uses nuget.org Trusted Publishing (GitHub OIDC -> short-lived API key); no long-lived secret.
# One-time setup:
#   1. nuget.org > Trusted Publishing > add policy: owner antongerbracht-brinks, repo Jackalope,
#      workflow file ci.yml, environment nuget.
#   2. GitHub repo > Settings > Secrets and variables > Actions > Variables: NUGET_USER = your nuget.org profile name.
# Until NUGET_USER is set, the publish job is skipped.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compute package version
        id: version
        run: |
          case "${{ github.event_name }}:${{ github.ref }}" in
            push:refs/tags/v*)  echo "args=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            pull_request:*)     echo "args=-p:VersionSuffix=pr.${{ github.event.number }}.${{ github.run_number }}" >> "$GITHUB_OUTPUT" ;;
            *)                  echo "args=-p:VersionSuffix=ci.${{ github.run_number }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release ${{ steps.version.outputs.args }}
      - run: dotnet test --no-build -c Release --logger trx --results-directory TestResults

      - name: Pack
        run: dotnet pack --no-build -c Release ${{ steps.version.outputs.args }} -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # Separate job so only this step (not the build/test code) runs with the OIDC token.
  publish:
    needs: build
    if: >
      github.event_name == 'push' && vars.NUGET_USER != '' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write   # required for nuget.org Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get short-lived nuget.org API key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        # Pushing the .nupkg files also pushes the matching .snupkg symbol packages.
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
